name: Build CachyOS BORE Minimal Kernel

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'CachyOS release tag (e.g., 7.2.4-1)'
        required: false
        default: '7.2.4-1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils flex bison libssl-dev libelf-dev \
            cpio pahole python3 libncurses-dev dwarfutils \
            zstd lz4 xz-utils git

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="build-${{ github.event.inputs.kernel_version || '7.2.4-1' }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            TAG="daily-$(date -u +%Y.%m.%d)"
          else
            TAG="push-$(date -u +%Y.%m.%d-%H%M)"
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG}"

      - name: Download kernel source
        env:
          KV: ${{ github.event.inputs.kernel_version || '7.2.4-1' }}
        run: |
          echo "Downloading cachyos-${KV}..."
          wget -q "https://github.com/CachyOS/linux/releases/download/cachyos-${KV}/cachyos-${KV}.tar.gz"
          mkdir -p kernel
          tar xf "cachyos-${KV}.tar.gz" -C kernel --strip-components=1
          rm -f "cachyos-${KV}.tar.gz"

      - name: Download BORE config
        run: |
          wget -q "https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-bore/config" \
            -O kernel/.config

      - name: Apply minimal config
        run: |
          cd kernel
          bash ../config/minimize.sh
          yes "" | make olddefconfig

      - name: Build kernel
        run: |
          cd kernel
          make -j$(nproc) bzImage modules 2>&1 | tee ../build.log

      - name: Package kernel and modules
        run: |
          cd kernel
          KVER=$(make -s kernelrelease)
          echo "${KVER}" > ../kernel-version

          mkdir -p ../stage/boot
          mkdir -p "../stage/lib/modules/${KVER}"
          cp arch/x86/boot/bzImage "../stage/boot/vmlinuz-${KVER}"
          make INSTALL_MOD_PATH="../stage" INSTALL_MOD_STRIP=1 modules_install
          rm -rf "../stage/lib/modules/${KVER}/build" \
                 "../stage/lib/modules/${KVER}/source"
          cp .config ../stage/config

      - name: Download linux-firmware
        run: |
          if timeout 600 git clone --depth 1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git \
            /tmp/firmware; then
            mkdir -p stage/lib/firmware
            cp -a /tmp/firmware/* stage/lib/firmware/
            rm -rf /tmp/firmware
          else
            echo "::warning::Firmware download failed, continuing without"
            mkdir -p stage/lib/firmware
          fi

      - name: Create release tarball
        run: |
          TARBALL="cachyos-bore-minimal-${TAG}.tar.zst"
          tar -C stage -cf - . | zstd -19 -T0 -o "${TARBALL}"
          ls -lh "${TARBALL}"
          KVER=$(cat kernel-version)
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "KVER=${KVER}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" \
            --title "CachyOS BORE Minimal ${KVER} (${TAG})" \
            --generate-notes \
            "${TARBALL}"
